<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="src/Store.js" defer></script>
  <script src="src/app.js" defer></script>
</head>
<body>
  <main class="container">
    <section id="store-list" aria-label="Store">
      <div class="form-panel">
        <div class="section-heading">
          <h1>Add something new<span>.</span></h1>
          <p>Your next find starts here.</p>
        </div>

        <form id="product-form" novalidate>
          <div class="field">
            <label for="name">Product name</label>
            <input
              id="name"
              name="name"
              type="text"
              placeholder="e.g. Headphones"
              aria-describedby="name-error"
              required
            >
            <p id="name-error" class="error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="price">Price, ₸</label>
            <input
              id="price"
              name="price"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="25000"
              aria-describedby="price-error"
              required
            >
            <p id="price-error" class="error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="qty">Quantity</label>
            <input
              id="qty"
              name="qty"
              type="number"
              min="0"
              step="1"
              placeholder="1"
              aria-describedby="qty-error"
              required
            >
            <p id="qty-error" class="error" aria-live="polite"></p>
          </div>

          <button type="submit" data-action="add">
            Add product <span aria-hidden="true">↗</span>
          </button>
        </form>
      </div>

      <section id="catalog" aria-labelledby="catalog-title">
        <div class="section-heading catalog-heading">
          <h2 id="catalog-title">The collection<span>.</span></h2>
          <p>Small details. Good choices.</p>
        </div>

        <p id="empty-message">
          Your collection starts here. Add your first product above.
        </p>

        <div id="products" class="product-grid"></div>

        <p id="store-message" role="status"></p>

        <div class="collection-total">
          <span>Total</span>
          <strong id="total" aria-live="polite">0 ₸</strong>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
